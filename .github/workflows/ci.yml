name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --workspace

  coverage:
    name: coverage (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate lcov + JSON summary
        # Exclude bin crate `main.rs` files — thin clap wrappers, untestable without subprocess.
        run: |
          cargo llvm-cov --all-features --workspace --ignore-filename-regex '(main|bin/[^/]+)\.rs$' --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --ignore-filename-regex '(main|bin/[^/]+)\.rs$' --json --summary-only > coverage.json
      - name: Enforce coverage gate
        run: |
          PCT=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          echo "Line coverage: ${PCT}%"
          python3 - <<EOF
          import sys
          pct = float("${PCT}")
          # 90% gate: lowered from 95% when the v0.2 git-aware bundle landed.
          # New CLI handlers (run_index / run_diff / run_gc) and the
          # cache / diff / git_source modules merged with partial coverage;
          # raising back to 95% is tracked as follow-up work.
          threshold = 90.0
          if pct < threshold:
              print(f"::error::coverage {pct}% < {threshold}%")
              sys.exit(1)
          print(f"OK: {pct}% >= {threshold}%")
          EOF
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  mermaid-validate:
    name: mermaid syntax (mmdc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff needs HEAD~1, full history is cheapest
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Configure puppeteer (Ubuntu 23.10+ AppArmor workaround)
        # Chromium can't launch its sandbox under recent Ubuntu's restricted
        # unprivileged user namespaces; pass `--no-sandbox` via mmdc's
        # puppeteer config. CI runners are ephemeral, sandbox isn't load-bearing.
        run: |
          cat > /tmp/puppeteer.json <<EOF
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          EOF
      - name: Build release a2m
        run: cargo build --release
      - name: Generate every CLI output and pipe through mmdc
        # If mmdc exits non-zero on any input, the job fails. The renderer is
        # the spec; mmdc is the validator. Fix bugs in the renderer (or
        # `mermaid_id`'s reserved-word list), not in the diagrams.
        run: |
          set -euo pipefail
          mkdir -p /tmp/mmd
          BIN=./target/release/a2m

          $BIN project  ./src                                  --out /tmp/mmd/project.mmd
          $BIN overview ./src                                  --out /tmp/mmd/overview.mmd
          $BIN module   ./src --target render/mod.rs           --out /tmp/mmd/module.mmd
          $BIN function ./src --target analyze                 --out /tmp/mmd/function.mmd
          $BIN impact   ./src --target analyze                 --out /tmp/mmd/impact.mmd
          # diff prints to stdout
          $BIN diff HEAD~1..HEAD --path ./src                  > /tmp/mmd/diff.mmd

          # Render each .mmd to an SVG via mmdc — non-zero exit on parse error.
          # We don't keep the SVGs; this is a syntax gate, not a build artifact.
          for f in /tmp/mmd/*.mmd; do
            echo "::group::validating $f"
            mmdc -q -p /tmp/puppeteer.json -i "$f" -o "${f%.mmd}.svg"
            echo "::endgroup::"
          done
          echo "all diagrams parsed cleanly"
