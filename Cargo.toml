[package]
name = "ast-to-mermaid"
description = "Git-aware tree-sitter-based code-graph builder. Emits Mermaid diagrams at five zoom levels, materializes per-commit bundles into a content-addressed cache, and computes coloured structural diffs between any two refs. Single binary `a2m` with ten subcommands."
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
authors = ["Anatta <noreply@anatta.dev>"]
license = "Apache-2.0"
repository = "https://github.com/anatta-rs/ast-to-mermaid"
homepage = "https://github.com/anatta-rs/ast-to-mermaid"
documentation = "https://docs.rs/ast-to-mermaid"
readme = "README.md"
keywords = ["mermaid", "tree-sitter", "ast", "code-graph", "visualization"]
categories = ["command-line-utilities", "visualization", "development-tools"]
exclude = [
    ".githooks/*",
    ".github/*",
    "Makefile",
    "release-plz.toml",
    "rust-toolchain.toml",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-dart = "0.2"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
ciborium = "0.2"
tempfile = "3"
rayon = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"

[[bin]]
name = "a2m"
path = "src/bin/a2m.rs"

[[bench]]
name = "store"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "resolve"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
