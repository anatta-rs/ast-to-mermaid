[package]
name = "ast-to-mermaid"
description = "Git-aware tree-sitter-based code-graph builder. Emits Mermaid diagrams at five zoom levels, materializes per-commit bundles into a content-addressed cache, and computes coloured structural diffs between any two refs. Single binary `a2m` with ten subcommands."
version = "0.2.0"
edition = "2024"
authors = ["Anatta <noreply@anatta.dev>"]
license = "Apache-2.0"
repository = "https://github.com/anatta-rs/ast-to-mermaid"
homepage = "https://github.com/anatta-rs/ast-to-mermaid"
readme = "README.md"
keywords = ["mermaid", "tree-sitter", "ast", "code-graph", "visualization"]
categories = ["command-line-utilities", "visualization", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
ciborium = "0.2"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "a2m"
path = "src/bin/a2m.rs"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
