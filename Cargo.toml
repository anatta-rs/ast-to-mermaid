[package]
name = "ast-to-mermaid"
description = "Mermaid diagram renderer for code ASTs — 5 levels (project/overview/module/function/impact) with cross-language support"
version = "0.1.0"
edition = "2024"
authors = ["Anatta <noreply@anatta.dev>"]
license = "Apache-2.0"
repository = "https://github.com/anatta-rs/ast-to-mermaid"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[[bin]]
name = "a2m-project"
path = "src/bin/a2m-project.rs"

[[bin]]
name = "a2m-overview"
path = "src/bin/a2m-overview.rs"

[[bin]]
name = "a2m-module"
path = "src/bin/a2m-module.rs"

[[bin]]
name = "a2m-function"
path = "src/bin/a2m-function.rs"

[[bin]]
name = "a2m-impact"
path = "src/bin/a2m-impact.rs"

[[bin]]
name = "a2m-walk"
path = "src/bin/a2m-walk.rs"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
