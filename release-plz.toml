# release-plz configuration
# Docs: https://release-plz.dev/docs/config
#
# Requires the `CARGO_REGISTRY_TOKEN` repository secret to publish to
# crates.io. The action runs in two phases via `.github/workflows/release-plz.yml`:
#   1. release-pr — opens / updates a "chore: release" PR with the version
#      bump + CHANGELOG.md update.
#   2. release    — when that PR is merged into main, tags the commit and
#      publishes the crate to crates.io.

[workspace]
# Publish ast-to-mermaid to crates.io when a release-PR is merged.
publish = true
# Cut a GitHub Release alongside the crates.io publish.
git_release_enable = true
git_release_type = "auto"
# Keep CHANGELOG.md up to date in the release PR.
changelog_update = true
# Keep semver-checks on — release-plz uses cargo-semver-checks to flag
# accidental breaking changes in the public API.
semver_check = true

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
  {%- if release_link -%}\
    ({{ release_link }})\
  {% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
    {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^ci", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "Breaking changes" },
]
